  c.fillStyle = '#e8a33a'; c.font = '900 40px Inter'; c.fillText('★★★★★ 4.6', 30, 710); c.fillStyle = '#111'; c.font = '900 64px Inter'; c.fillText('$899', 30, 800); c.fillStyle = '#188038'; c.font = '800 40px Inter'; c.fillText('10 mil+ vendidos', 30, 870); }

const bed = new THREE.Group(); { const f = new THREE.Mesh(kit.rbox(1.1, 0.35, 2.1, 0.05), MAT('#7a5034')); f.position.y = 0.17; bed.add(f); const m = new THREE.Mesh(kit.rbox(1.0, 0.2, 2.0, 0.08), MAT('#f2efe8')); m.position.y = 0.45; bed.add(m); const pl = new THREE.Mesh(kit.rbox(0.6, 0.14, 0.32, 0.06), MAT('#ffffff')); pl.position.set(0, 0.6, -0.8); bed.add(pl); const bl = new THREE.Mesh(kit.rbox(1.06, 0.1, 1.3, 0.05), MAT('#3a6ab0')); bl.position.set(0, 0.62, 0.32); bed.add(bl); bed.userData.blanket = bl; }
bed.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } }); scene.add(bed);

const hideAll = () => { for (const c of Object.values(C)) c.position.set(0, -50, 0); chair.position.y = -50; table.position.y = -50; bed.position.y = -50; };
const look = (x, y, z, tx, ty, tz, fov = 30) => { cam.position.set(x, y, z); cam.lookAt(tx, ty, tz); cam.fov = fov; cam.updateProjectionMatrix(); };
window.renderAt = (t) => {
  const i = Math.floor(t + 1e-6), u = t - i; hideAll(); const T = 1.3 + u;
  for (const c of Object.values(C)) { c.rotation.set(0, 0, 0); }
  const show = (id, pose, expr, o = {}) => { const c = C[id]; c.position.set(0, 0, 0); kit.setPose(c, pose, T, o); kit.setExpression(c, expr); return c; };
  if (i === 0) { const c = show('vendedor', 'celebrate', 'grin'); kit.hold(c, 'R', phone, { at: [0, -0.03, 0.012], rot: [0, 0, Math.PI], scale: PS }); look(0.6, 1.5, 3.6, 0, 1.3, 0); }
