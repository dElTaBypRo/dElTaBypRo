<script type="module">
// Cast preview for the Amazon video: renderAt(i) shows view i (0-5 portraits, 6+ pose/hold tests).
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

import { createKit } from '../kit/charkit.js';

const W = 1080, H = 1920;
const kit = createKit(THREE, RoundedBoxGeometry); const props = createProps(THREE, kit, 'clay');

r.setSize(W, H, false); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.92;

const scene = new THREE.Scene(); scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(r), 0.04).texture; scene.environmentIntensity = 0.3;

const IDS = ['abuelo', 'nieto', 'slim', 'salinas', 'ocde', 'reguladora'];
const C = Object.fromEntries(IDS.map(id => { const c = kit.build(kit.PRESETS[id], 'clay'); scene.add(c); return [id, c]; }));
C.slim90 = kit.build(kit.deepMerge(structuredClone(kit.PRESETS.slim), { hair: { color: '#4a4a4a' }, brows: { color: '#2a2a2a' }, head: { jowl: 0.35 }, body: { belly: 0.45 } }), 'clay'); scene.add(C.slim90);
const phone = props.screenPhone(); phone.userData.draw((c, w, h) => { c.fillStyle = '#0d1b2a'; c.fillRect(0, 0, w, h); c.fillStyle = '#7CFFB2'; c.font = '900 80px Inter'; c.fillText('$125,000', 20, 400); }); const PS = 1.7;
const cam = new THREE.PerspectiveCamera(30, W / H, 0.05, 100);
const look = (x, y, z, tx, ty, tz, fov = 30) => { cam.position.set(x, y, z); cam.lookAt(tx, ty, tz); cam.fov = fov; cam.updateProjectionMatrix(); };

  const i = Math.floor(t + 1e-6), u = t - i; const T = 1.3 + u;
  for (const c of Object.values(C)) { c.position.set(0, -50, 0); c.rotation.set(0, 0, 0); }
  const id = ['abuelo', 'nieto', 'slim', 'salinas', 'ocde', 'reguladora', 'slim90'][i] || 'abuelo';
  const c = C[id]; c.position.set(0, 0, 0); c.rotation.y = 0.35;

};
