// ---------- renderer & sets ----------

const salinas = mkC('salinas', 'auction'), slim90 = mkC('slim', 'auction', SLIM90);
const partners = [mkC('rico', 'auction', { glasses: { style: 'none' }, hair: { color: '#c9a060' }, outfit: { top: '#3a3a3a', pants: '#3a3a3a', tie: '#2a4a8a' }, expression: 'happy' }),

const bidders = [3, 7, 11, 19].map(s => { const c = kit.build(kit.townsperson(s), 'clay'); S.auction.add(c); sets.setEnvIntensity(c, ENVI.auction); return c; });
const ocde = mkC('ocde', 'chart'), slimC = mkC('slim', 'chart');
const slimM = mkC('slim', 'money');

// ---------- props ----------

const receiptDraw = (c, w, h) => { c.fillStyle = '#efe2b8'; c.fillRect(0, 0, w, h); c.fillStyle = 'rgba(120,90,40,0.18)'; for (let i = 0; i < 30; i++) c.fillRect((i * 97) % w, (i * 61) % h, 40, 3);

  c.font = F(700, w * 0.048); [['Renta mensual', '$78.00'], ['Larga distancia', ''], ['  Tijuana  32 min', '$412.80'], ['  Tijuana  18 min', '$232.20'], ['  Monterrey 9 min', '$96.30']].forEach(([a, b], i) => { c.fillText(a, w * 0.06, h * (0.26 + i * 0.075)); c.textAlign = 'right'; c.fillText(b, w * 0.94, h * (0.26 + i * 0.075)); c.textAlign = 'left'; });
  c.fillRect(w * 0.06, h * 0.66, w * 0.88, 4); c.font = F(900, w * 0.07); c.fillText('TOTAL', w * 0.06, h * 0.75); c.textAlign = 'right'; c.fillStyle = '#b0201a'; c.fillText('$819.30', w * 0.94, h * 0.75); c.textAlign = 'left';
  c.fillStyle = '#b0201a'; c.font = F(900, w * 0.06); c.save(); c.translate(w * 0.5, h * 0.88); c.rotate(-0.12); c.textAlign = 'center'; c.fillText('¡PAGUE A TIEMPO!', 0, 0); c.restore(); };
const receipt = kit.hold(AB.living, 'R', paperProp(0.13, 0.2, receiptDraw), { at: [0, -0.06, 0.01], rot: [0, 0, Math.PI], scale: PS });
const amparo = kit.hold(slimR, 'R', paperProp(0.13, 0.18, (c, w, h) => { c.fillStyle = '#f6f3ea'; c.fillRect(0, 0, w, h); c.fillStyle = '#111'; c.font = F(900, w * 0.16); c.textAlign = 'center'; c.fillText('AMPARO', w / 2, h * 0.25); c.font = F(700, w * 0.05); for (let i = 0; i < 9; i++) c.fillRect(w * 0.12, h * (0.36 + i * 0.06), w * (0.76 - (i % 3) * 0.1), 5); c.fillStyle = '#1a3a8a'; c.beginPath(); c.arc(w * 0.72, h * 0.9, w * 0.09, 0, 7); c.fill(); }), { at: [0, -0.06, 0.01], rot: [0, 0, Math.PI], scale: PS });

const gavel = (() => { const g = new THREE.Group(); const wood = kit.makeMat('#6a3e22', 'leather', 'clay'); const h = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.2, 10), wood); h.position.y = 0.0; g.add(h);

const paddle = (() => { const g = new THREE.Group(); const hnd = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.16, 8), kit.makeMat('#c9a26b', 'leather', 'clay')); hnd.position.y = 0.0; g.add(hnd);

const crown = (() => { const g = new THREE.Group(); const gold = new THREE.MeshStandardMaterial({ color: '#f2c230', metalness: 0.9, roughness: 0.25 }); const band = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.22, 0.09, 24, 1, true), gold); band.material.side = THREE.DoubleSide; g.add(band);

// ---------- screen / phone content ----------
const forbesApp = (c, w, h) => { c.fillStyle = '#ffffff'; c.fillRect(0, 0, w, h); c.fillStyle = '#111'; c.fillRect(0, 0, w, 140); c.fillStyle = '#fff'; c.font = F(900, 56); c.fillText('Multimillonarios 2026', 26, 92);
  c.fillStyle = '#5a6475'; c.font = F(700, 32); c.fillText('Lista anual · marzo 2026', 26, 200); c.fillStyle = '#111'; c.font = F(900, 46); c.fillText('Carlos Slim Helú', 26, 300); c.fillStyle = '#188038'; c.font = F(900, 110); c.fillText('$125,000', 18, 450);
  c.fillStyle = '#111'; c.font = F(800, 38); c.fillText('millones de dólares', 26, 510); c.fillStyle = '#d93025'; c.font = F(900, 40); c.fillText('▲ récord personal', 26, 600); c.fillStyle = '#5a6475'; c.font = F(700, 30); c.fillText('El más rico de México', 26, 680); };
const nietoPhone = (sig) => (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#3a2a6a'); g.addColorStop(1, '#0f1a3a'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(0, 0, w, 110); c.fillStyle = '#fff'; c.font = F(800, 40); c.fillText('9:41', 24, 72); c.textAlign = 'right'; c.font = F(800, 38);

  if (sig > 0.5) { c.strokeStyle = '#ffd84a'; c.lineWidth = 8; c.beginPath(); c.roundRect(w - 330, 20, 300, 76, 20); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,0.9)'; c.font = F(900, 120); c.textAlign = 'center'; c.fillText('9:41', w / 2, 420); c.font = F(700, 36); c.fillText('martes 18 de noviembre', w / 2, 480); c.textAlign = 'left'; };
phoneA.userData.draw(forbesApp); phoneN.userData.draw(nietoPhone(0));

// ---------- helpers ----------
const _v = new THREE.Vector3();
const headPos = (c) => { c.updateMatrixWorld(true); return c.userData.rig.head.getWorldPosition(new THREE.Vector3()); };

const speakerAt = (t) => { for (const l of DATA.lines) if (t >= l.start - 0.2 && t <= l.end + 0.3) return l.speaker; return null; };

// ---------- shots ----------
const tS = {
  recibo: LN.A1.start - 0.15, n2: LN.N2.start - 0.2, a2: LN.A2.start - 0.15, n3: LN.N3.start - 0.2,
  aWide: LN.S1.start - 1.25, salinas: LN.S1.start + 0.9, bid: LN.C1.start - 0.15, obs1: LN.N4.start - 0.2, pilon: LN.S2.start - 0.15, deal: LN.C2.start - 0.25,
  cWide: LN.N5.start - 1.1, pies: wAt('A3', '2012') - 0.3, n6: LN.N6.start - 0.2, ocde: LN.O1.start - 0.15, bill: wAt('O1', '129') - 0.3, peek: LN.C3.start - 0.2,
  mWide: LN.N7.start - 1.05, summit: LN.C4.start - 0.2, obs2: LN.N8.start - 0.2,
  rWide: LN.R1.start - 1.05, stamp: wAt('R1', 'preponderante') - 0.6, amparo: LN.C5.start - 0.2, obs3: LN.N9.start - 0.2, poof: LN.A4.start - 0.15,
  home: LN.N10.start - 1.05, forbes: wAt('A5', '125') - 0.25, n11: LN.N11.start - 0.2, final: LN.A6.start - 0.15, phoneSig: wAt('A6', 'pero') - 0.15, stare: LN.A6.end + 0.35,
};
const SHOTS = [['open', 0, 'living'], ['recibo', tS.recibo, 'living'], ['n2', tS.n2, 'living'], ['a2', tS.a2, 'living'], ['n3', tS.n3, 'living'],
  ['aWide', tS.aWide, 'auction', 2], ['salinas', tS.salinas, 'auction'], ['bid', tS.bid, 'auction'], ['obs1', tS.obs1, 'auction'], ['pilon', tS.pilon, 'auction'], ['deal', tS.deal, 'auction'],
  ['cWide', tS.cWide, 'chart', 2], ['pies', tS.pies, 'chart'], ['n6', tS.n6, 'chart'], ['ocde', tS.ocde, 'chart'], ['bill', tS.bill, 'chart'], ['peek', tS.peek, 'chart'],
  ['mWide', tS.mWide, 'money', 2], ['summit', tS.summit, 'money'], ['obs2', tS.obs2, 'money'],
  ['rWide', tS.rWide, 'reg', 2], ['stamp', tS.stamp, 'reg'], ['amparo', tS.amparo, 'reg'], ['obs3', tS.obs3, 'reg'], ['poof', tS.poof, 'reg'],
  ['home', tS.home, 'living', 2], ['forbes', tS.forbes, 'living'], ['n11', tS.n11, 'living'], ['final', tS.final, 'living'], ['phoneSig', tS.phoneSig, 'living'], ['stare', tS.stare, 'living'], ['end', END + 1, 'living']]
  .map(([name, t, sc, sub]) => ({ name, t, sc, sub }));
const shotIdx = (t) => { let i = 0; while (i + 1 < SHOTS.length && t >= SHOTS[i + 1].t) i++; return i; };

// ---------- observers (grandpa + grandson in a corner of each past scene) ----------
const OBS_RY = { money: 0.35 }; // override: face the camera side instead of the mountain
function observers(sc, t, frozen) {
  const o = U[sc].observerSpot || { x: 2, z: 1, ry: -0.8 }; const ab = AB[sc], ni = NI[sc];
  const ry = OBS_RY[sc] ?? o.ry ?? 0; const dx = Math.cos(ry) * 0.42, dz = -Math.sin(ry) * 0.42;
  place(ab, o.x - dx, o.z - dz, ry); place(ni, o.x + dx, o.z + dz, ry);
  const spk = speakerAt(t);
  act(ab, 'abuelo', spk === 'abuelo' ? 'shrug' : 'handsBehind', spk === 'abuelo' ? 'smug' : 'neutral', t, { seed: 6 });
  act(ni, 'nieto', spk === 'nieto' ? 'shrug' : 'crossed', spk === 'nieto' ? 'surprised' : 'neutral', t, { seed: 7 });

// ---------- living room ----------
function stateLiving(t, sh) {

  const late = t > tS.home - 0.1; const spk = speakerAt(t);

  act(ni, 'nieto', 'lookPhone', shocked ? 'shocked' : t > LN.N11.start - 0.2 && t < LN.A6.start ? 'happy' : t > LN.A6.end ? 'worried' : 'neutral', t, { sit: true, seed: 3 });
  phoneN.userData.draw(nietoPhone(t > tS.phoneSig ? clamp((t - tS.phoneSig) / 0.3) : 0));
  if (spk === 'abuelo') lookAt(ni, headPos(ab), 0.9); else if (sh !== 'stare') lookAt(ni, ap === 'showPhone' ? worldOf(receipt) : headPos(ab), 0.6);
  if (spk === 'nieto') lookAt(ab, headPos(ni), 0.8); else if (phoneA.visible) lookAt(ab, worldOf(phoneA), 0.6);
  if (sh === 'stare') { const cp = ni.localToWorld(V(-0.35, 0, 2.3)); cp.y = headPos(ni).y - 0.1; lookAt(ni, cp, 0.95); }
}
function camLiving(t, sh, a, b) { const u = clamp((t - a) / (b - a)); const ab = AB.living, ni = NI.living;
  const mid = vl(headPos(ab), headPos(ni), 0.5);

  if (sh === 'recibo') { insert(receipt, 0.62 - 0.05 * u, 34); return; }

// ---------- 1990 auction (sepia in post) ----------
function stateAuction(t, sh) {
