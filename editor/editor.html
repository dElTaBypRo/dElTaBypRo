<title>Molde de Personajes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: 3D stage on the left (top on phones), control rack on the right. */
:root {
  --bg: #eef1f6; --panel: #ffffff; --ink: #18202c; --muted: #5d6a7c; --line: #d9dfe8;
  --accent: #ff5b2e; --accent-ink: #ffffff; --stage: #e3e8f0; --chip: #f2f4f8;
  --f-display: "Space Grotesk", "Inter", system-ui, sans-serif; --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --panel: #1a2029; --ink: #e8edf4; --muted: #94a1b3; --line: #2b3441; --accent: #ff7a52; --accent-ink: #14100e; --stage: #1e2530; --chip: #222a35; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #12161d; --panel: #1a2029; --ink: #e8edf4; --muted: #94a1b3; --line: #2b3441; --accent: #ff7a52; --accent-ink: #14100e; --stage: #1e2530; --chip: #222a35; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
.stage { position: relative; background: var(--stage); min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage .badge { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 14px; font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
.stage .badge small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.stage .hint { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 12px; font-size: 12px; color: var(--muted); }
.rack { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.group { display: flex; flex-direction: column; gap: 9px; }
.group > h2 { font-family: var(--f-display); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 44px; align-items: center; gap: 8px; }
.row label { font-size: 13px; color: var(--ink); }
.row output { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); text-align: right; }
.row.color { grid-template-columns: 96px 44px minmax(0, 1fr); }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=color] { width: 44px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; cursor: pointer; }
select, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.chip:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.status { font-size: 12px; color: var(--muted); min-height: 16px; }
.saved { display: flex; flex-direction: column; gap: 6px; }
.saved button { text-align: left; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.saved button span { color: var(--muted); font-size: 12px; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 56vh auto; height: auto; }
  .stage { height: 56vh; }
  .rack { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="Vista 3D del personaje"></canvas>
    <div class="badge"><span id="charName">Jensen Huang</span><small id="charMeta">Vinilo · Contento · Quieto</small></div>
    <div class="hint">Arrastra para girar · rueda o pellizco para acercar</div>
  </div>

  <aside class="rack" aria-label="Controles del personaje">
    <section class="group">
      <h2>Personaje</h2>
      <div class="chips" id="presetChips"></div>
      <div class="row" style="grid-template-columns:96px minmax(0,1fr)"><label for="name">Nombre</label><input type="text" id="name"></div>
    </section>

    <section class="group">
      <h2>Escena</h2>
      <div class="chips" id="sceneChips"></div>
    </section>

    <section class="group">
      <h2>Acabado</h2>
      <div class="chips" id="finishChips"></div>
    </section>

    <section class="group">
      <h2>Expresión</h2>
      <div class="chips" id="exprChips"></div>
    </section>

    <section class="group">
      <h2>Pose</h2>
      <div class="chips" id="poseChips"></div>
    </section>

    <section class="group">
      <h2>Manos</h2>
      <div class="row" style="grid-template-columns:96px minmax(0,1fr)"><label>Derecha</label><div class="chips" id="handRChips"></div></div>
      <div class="row" style="grid-template-columns:96px minmax(0,1fr)"><label>Izquierda</label><div class="chips" id="handLChips"></div></div>
    </section>

    <details open><summary>Cabeza y cara</summary><div class="group" id="g-head"></div></details>
    <details><summary>Pelo y lentes</summary><div class="group" id="g-hair"></div></details>
    <details open><summary>Cuerpo</summary><div class="group" id="g-body"></div></details>
    <details><summary>Ropa</summary><div class="group" id="g-outfit"></div></details>
    <details><summary>Accesorios</summary><div class="group" id="g-acc"></div></details>

    <section class="group">
      <h2>Guardar</h2>
      <div class="actions">
        <button class="btn primary" id="saveBtn" type="button">Guardar personaje</button>
        <button class="btn" id="copyBtn" type="button">Copiar ajustes</button>
        <button class="btn" id="resetBtn" type="button">Restablecer</button>
      </div>
      <div class="status" id="status" role="status"></div>
      <textarea id="copyArea" hidden rows="4" style="width:100%;font:12px ui-monospace,monospace;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px"></textarea>
    </section>

    <section class="group">
      <h2>Guardados</h2>
      <div class="saved" id="savedList"><div class="status">Cargando personajes guardados…</div></div>
    </section>
  </aside>
</div>

const ga = $('g-acc');
select(ga, 'acc.hat', 'Sombrero', LABEL.hat); color(ga, 'acc.hatColor', 'Color sombrero');
check(ga, 'acc.watch', 'Reloj de oro'); check(ga, 'acc.chain', 'Cadena de oro'); check(ga, 'acc.badge', 'Gafete'); check(ga, 'acc.cigar', 'Puro');

$('name').addEventListener('input', () => { state.name = $('name').value; updateBadge(); });
$('resetBtn').addEventListener('click', () => { state = structuredClone(kit.PRESETS[presetId] || kit.DEFAULT); syncAll(); rebuild(); status('Restablecido a ' + (LABEL.preset[presetId] || 'la base') + '.'); });

function updateBadge() {
  $('charName').textContent = state.name || 'Sin nombre';
  $('charMeta').textContent = `${LABEL.finish[finish]} · ${LABEL.expr[state.expression] || state.expression} · ${LABEL.pose[state.pose] || state.pose}`;
}
const status = (msg) => { $('status').textContent = msg; };

// copy settings
$('copyBtn').addEventListener('click', () => {
  const txt = JSON.stringify({ finish, ...state });
  const ta = $('copyArea');
  navigator.clipboard?.writeText(txt).then(() => status('Ajustes copiados.'), () => { ta.hidden = false; ta.value = txt; ta.select(); status('Copia el texto seleccionado.'); })
    ?? (ta.hidden = false, ta.value = txt, ta.select(), status('Copia el texto seleccionado.'));
});

// ---------- saving (db) ----------
const slug = (s) => (s || 'personaje').toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'personaje';
let db = null;
const savedList = $('savedList');
function renderSaved(docs) {
  savedList.innerHTML = '';
  if (!docs.length) { savedList.innerHTML = '<div class="status">Todavía no hay personajes guardados. Ajusta uno y toca “Guardar personaje”.</div>'; return; }
  for (const d of docs) {
    const v = d.data(); const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = `<b></b><span></span>`; b.querySelector('b').textContent = v.params?.name || d.id; b.querySelector('span').textContent = LABEL.finish[v.finish] || '';
    b.addEventListener('click', () => { state = kit.deepMerge(structuredClone(kit.DEFAULT), v.params || {}); finish = v.finish || finish; presetId = ''; syncAll(); rebuild(); status('Cargado: ' + (v.params?.name || d.id)); });
    savedList.appendChild(b);
  }
}
(async () => {
  try { db = await window.claude?.use?.('db'); } catch { db = null; }
  if (!db) { savedList.innerHTML = '<div class="status">Para guardar personajes abre esta página con tu cuenta. Mientras tanto puedes usar “Copiar ajustes”.</div>'; $('saveBtn').disabled = true; return; }
  const timer = setTimeout(() => { savedList.innerHTML = '<div class="status">No se pudieron cargar los guardados todavía.</div>'; }, 10000);
  db.collection('characters').onSnapshot((snap) => { if (!snap.metadata.fromCache) clearTimeout(timer); renderSaved(snap.docs); },
    () => { clearTimeout(timer); savedList.innerHTML = '<div class="status">No se pudieron cargar los guardados.</div>'; });
})();
let saving = false;
$('saveBtn').addEventListener('click', async () => {
  if (!db || saving) return; saving = true; status('Guardando…');
  try { await db.doc('characters/' + slug(state.name)).set({ params: structuredClone(state), finish, savedAt: new Date().toISOString() }); status('Guardado: ' + state.name + '. Claude ya lo puede usar en los videos.'); }
  catch (e) { status(e?.code === 'invalid_argument' ? 'Esta cuenta no tiene permiso para guardar aquí.' : 'No se pudo guardar. Intenta de nuevo.'); }
  saving = false;
});

syncAll(); rebuild(); resize();
</script>
